name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: Lint Markdown
        run: markdownlint-cli2 "**/*.md" "#node_modules"

      - name: Check required root files
        run: |
          for f in README.md LICENSE CONTRIBUTING.md CHANGELOG.md CODE_OF_CONDUCT.md; do
            [ -f "$f" ] || { echo "Missing: $f"; exit 1; }
          done
          echo "All required root files present."

      - name: Check docs directory
        run: |
          [ -d "docs" ] || { echo "Missing: docs/"; exit 1; }
          ls docs/*.md > /dev/null 2>&1 || { echo "No .md files in docs/"; exit 1; }
          echo "docs/ validated."
